<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f2f5f9;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        header {
            background: #1e3a8a;
            color: white;
            padding: 25px;
            text-align: center;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        header h1 {
            margin-bottom: 8px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        .form {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            border: none;
            padding: 12px 18px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 15px;
        }

        .add-btn {
            background: #16a34a;
            color: white;
        }

        .add-btn:hover {
            background: #15803d;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
        }

        .delete-btn:hover {
            background: #b91c1c;
        }

        .search {
            margin-bottom: 15px;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .count {
            background: #2563eb;
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 13px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #eff6ff;
            color: #1e3a8a;
        }

        .empty {
            text-align: center;
            padding: 25px;
            color: #777;
        }

        @media (max-width: 700px) {
            .form {
                grid-template-columns: 1fr;
            }

            table {
                font-size: 13px;
            }

            th, td {
                padding: 8px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <h1>🎓 Student Management System</h1>
        <p>HTML + CSS + JavaScript Mini Project</p>
    </header>

    <!-- Add Student -->
    <div class="card">

        <h2>Add Student</h2>
        <br>

        <div class="form">

            <input type="text" id="name" placeholder="Student Name">

            <input type="text" id="roll" placeholder="Roll Number">

            <input type="text" id="course" placeholder="Course">

            <button class="add-btn" onclick="addStudent()">
                ➕ Add Student
            </button>

        </div>

    </div>

    <!-- Student List -->
    <div class="card">

        <div class="stats">

            <h2>Student List</h2>

            <div class="count">
                Total: <span id="total">0</span>
            </div>

        </div>

        <input
            class="search"
            type="text"
            id="search"
            placeholder="🔎 Search student..."
            onkeyup="searchStudents()"
        >

        <table>

            <thead>
                <tr>
                    <th>#</th>
                    <th>Name</th>
                    <th>Roll No.</th>
                    <th>Course</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="studentTable"></tbody>

        </table>

    </div>

</div>


<script>

    // Get students from localStorage
    let students = JSON.parse(localStorage.getItem("students")) || [];

    // Add student
    function addStudent() {

        let name = document.getElementById("name").value.trim();
        let roll = document.getElementById("roll").value.trim();
        let course = document.getElementById("course").value.trim();

        if (name === "" || roll === "" || course === "") {

            alert("Please fill all fields!");

            return;
        }

        // Check duplicate roll number
        let exists = students.some(student => student.roll === roll);

        if (exists) {

            alert("Roll number already exists!");

            return;
        }

        let student = {
            name: name,
            roll: roll,
            course: course
        };

        students.push(student);

        saveStudents();

        displayStudents();

        // Clear inputs
        document.getElementById("name").value = "";
        document.getElementById("roll").value = "";
        document.getElementById("course").value = "";

    }


    // Display students
    function displayStudents(list = students) {

        let table = document.getElementById("studentTable");

        table.innerHTML = "";

        if (list.length === 0) {

            table.innerHTML = `
                <tr>
                    <td colspan="5" class="empty">
                        No students found
                    </td>
                </tr>
            `;

        } else {

            list.forEach((student, index) => {

                let row = `
                    <tr>

                        <td>${index + 1}</td>

                        <td>${student.name}</td>

                        <td>${student.roll}</td>

                        <td>${student.course}</td>

                        <td>
                            <button
                                class="delete-btn"
                                onclick="deleteStudent('${student.roll}')">
                                Delete
                            </button>
                        </td>

                    </tr>
                `;

                table.innerHTML += row;

            });

        }

        document.getElementById("total").innerText = students.length;

    }


    // Delete student
    function deleteStudent(roll) {

        if (confirm("Are you sure you want to delete this student?")) {

            students = students.filter(student => student.roll !== roll);

            saveStudents();

            displayStudents();

        }

    }


    // Search students
    function searchStudents() {

        let searchText =
            document.getElementById("search").value.toLowerCase();

        let filtered = students.filter(student =>

            student.name.toLowerCase().includes(searchText) ||

            student.roll.toLowerCase().includes(searchText) ||

            student.course.toLowerCase().includes(searchText)

        );

        displayStudents(filtered);

    }


    // Save data
    function saveStudents() {

        localStorage.setItem(
            "students",
            JSON.stringify(students)
        );

    }


    // Load students when page opens
    displayStudents();

</script>

</body>
</html>
